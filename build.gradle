plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = api_group
version = api_version

base {
    archivesName = 'thaumic-reborn-api-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    // Contract tests use the same Minecraft/NeoForge dependencies as the library.
    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('verifyApiSources') {
    def checked = files('src', 'README.md', 'ADDON_SETUP.md', 'build.gradle',
            'settings.gradle', 'gradle.properties')
    inputs.files(checked)
    doLast {
        def forbidden = 'thaumcraft' + 'modern'
        def offenders = fileTree(projectDir) {
            include 'src/**', 'README.md', 'ADDON_SETUP.md', '*.gradle', 'gradle.properties'
        }.files.findAll { it.isFile() && it.getText('UTF-8').contains(forbidden) }
        if (!offenders.empty) {
            throw new GradleException("obsolete mod id found in: ${offenders}")
        }
        if (!file('src/main/resources/META-INF/neoforge.mods.toml').isFile()) {
            throw new GradleException('public API must declare its standalone NeoForge mod')
        }
        def raisedWaistSource = file(
                'src/main/java/com/thaumicreborn/api/equipment/RaisedWaistArmor.java')
        if (!raisedWaistSource.isFile()) {
            throw new GradleException('raised-waist equipment contract is missing')
        }
        def commonClientImports = fileTree('src/main/java/com/thaumicreborn/api') {
            include '**/*.java'
            exclude 'client/**'
        }.files.findAll {
            it.getText('UTF-8').contains('net.minecraft.client')
        }
        if (!commonClientImports.empty) {
            throw new GradleException(
                    "common API sources import client-only Minecraft classes: ${commonClientImports}")
        }
    }
}

tasks.register('verifyApiJar') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def tree = zipTree(artifact)
        if (tree.matching { include 'META-INF/neoforge.mods.toml' }.isEmpty()
                || tree.matching { include 'com/thaumicreborn/apimod/ThaumicRebornApiMod.class' }.isEmpty()) {
            throw new GradleException('API JAR is missing its loader identity')
        }
        if (tree.matching { include 'com/thaumicreborn/api/**/*.class' }.isEmpty()) {
            throw new GradleException('API JAR contains no public API classes')
        }
        if (tree.matching {
            include 'com/thaumicreborn/api/equipment/RaisedWaistArmor.class'
        }.isEmpty()) {
            throw new GradleException('API JAR is missing RaisedWaistArmor')
        }
        if (tree.matching {
            include 'com/thaumicreborn/api/wand/WandRod.class'
            include 'com/thaumicreborn/api/wand/WandCap.class'
        }.files.size() != 2) {
            throw new GradleException('API JAR is missing wand component definitions')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyApiSources'), tasks.named('verifyApiJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = 'thaumic-reborn-api-neoforge'
        }
    }
    repositories {
        maven {
            name = 'localApiRepository'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

tasks.named('processResources') {
    inputs.property('api_version', project.version.toString())
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(api_version: project.version.toString())
    }
}
