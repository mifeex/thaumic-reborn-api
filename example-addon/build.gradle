plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '1.1.0'
group = 'com.thaumicreborn.example'

base {
    archivesName = 'thaumic-reborn-example-addon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':')
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.register('verifyNoBundledApi') {
    dependsOn tasks.named('jar')
    doLast {
        def bundled = zipTree(tasks.named('jar').get().archiveFile).matching {
            include 'com/thaumicreborn/api/**'
        }.files
        if (!bundled.empty) {
            throw new GradleException('Example addon bundled Thaumic Reborn API classes')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyNoBundledApi')
}
